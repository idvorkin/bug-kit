# Inherit the operator's configured agent. Gate-control settings become active
# once this file lands on the default branch; do not enable branch overrides.
commands:
  lint: |
    set -eu
    git diff --check
    for script in scripts/*.sh; do bash -n "$script"; done
    python3 -m py_compile listener/bug-listener
    python3 -m compileall -q listener Tests scripts/tests

# Keep Test focused on the change. The complete regression suite runs in CI.
test:
  instructions: |
    Host rung only: run the touched module's host tests (swift test --filter / jest / pytest) and read the diff.
    Do not build for, create, or boot a simulator, and do not run xcodebuild against a simulator or device;
    the driving session owns live evidence under the build turn. List what only the simulator or phone can show
    as "to verify live" in the report. Do not re-run `just test`: the gate already ran it.
    BugKit host commands use Swift 6+ and uv:
      swift test --jobs 2 --filter <test-name>
      uv run --python 3.12 --with typer --with pytest pytest --import-mode=importlib listener/ Tests/ scripts/tests/ -k <case> -q
    The outer driver holds ~/tmp/agent/locks/build.lock: do not reacquire it in nested commands.
    Run heavy host commands one at a time. Do not file real issues, send notifications, or deploy to devices;
    listener and deployment tests use fake tools for those effects.
    Live simulator and device checks happen once in the driving session's build turn and are recorded in the PR body.
    Only one simulator on this Mac at a time: before booting, check xcrun simctl list devices booted and wait until it's empty; shut yours down when done.

document:
  instructions: |
    README.md owns quick start, per-feature enablement and developer commands.
    docs/integration.md owns app integration; docs/ops/listener.md owns listener
    operations; docs/report-format.md owns persisted evidence formats. Update
    relevant docs when flags, defaults, commands or report fields change.

auto_fix:
  review: 0

ci:
  revalidate_repairs: true
