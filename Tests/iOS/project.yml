name: BugKitDiagnostics
options:
  bundleIdPrefix: local.bugkit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
targets:
  DiagnosticsHost:
    type: application
    platform: iOS
    sources:
      - TestHost.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bugkit.diagnostics-host
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  BugKit:
    type: framework
    platform: iOS
    sources:
      - ../../Sources/BugKit
  DiagnosticsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../BugKitTests/InteractionDiagnosticsTests.swift
      - ../BugKitTests/ScreenshotPrivacyTests.swift
      - ../BugKitTests/ShakeTests.swift
      - ../BugKitTests/WhatsNewDismissSizeTests.swift
    dependencies:
      - target: BugKit
      - target: DiagnosticsHost
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DiagnosticsHost.app/DiagnosticsHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BugKitDiagnostics:
    build:
      targets:
        BugKit: all
        DiagnosticsTests: [test]
    test:
      targets:
        - DiagnosticsTests
